# Applied on every launch after retroarch.cfg: the drivers for the R36S and
# the folders inside RetroArch's mount namespace. /save is the app's Gizlet
# save folder; games are read from /home, /media or /mnt.
video_driver = "gl"
video_context_driver = "kms"
audio_driver = "alsa"
input_driver = "udev"
input_joypad_driver = "udev"
menu_driver = "rgui"
joypad_autoconfig_dir = "/usr/share/gizlet-retroarch/autoconfig"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
savefile_directory = "/save/saves"
savestate_directory = "/save/states"
system_directory = "/save/system"
screenshot_directory = "/save/screenshots"
playlist_directory = "/save/playlists"
content_history_path = "/save/content_history.lpl"
content_favorites_path = "/save/content_favorites.lpl"
core_options_path = "/save/retroarch-core-options.cfg"
input_remapping_directory = "/save/remaps"
cheat_database_path = "/save/cheats"
recording_output_directory = "/save/recordings"
thumbnails_directory = "/save/thumbnails"
log_dir = "/save/logs"
cache_directory = "/tmp"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
# Each run's log, in the save folder's logs/, for finding out what went wrong.
log_to_file = "true"
log_to_file_timestamp = "false"
log_verbosity = "true"
