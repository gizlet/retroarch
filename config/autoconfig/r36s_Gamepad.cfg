# The R36S's built-in controls, as Gizlet OS's joypad driver reports them.
# RetroArch's udev driver numbers buttons in key-code order from BTN_JOYSTICK:
# BTN_SOUTH (the B face button) 0, BTN_EAST (A) 1, BTN_NORTH (X) 2,
# BTN_WEST (Y) 3, BTN_TL 4, BTN_TR 5, BTN_TL2 6, BTN_TR2 7, BTN_SELECT 8,
# BTN_START 9, BTN_MODE (FN) 10, BTN_THUMBL 11, BTN_THUMBR 12, then the D-pad
# BTN_DPAD_UP..RIGHT 13-16. The sticks are ABS_X, ABS_Y, ABS_RX and ABS_RY.
# Holding FN, or Select and Start, belongs to Gizlet OS: it ends the app.
input_driver = "udev"
input_device = "r36s_Gamepad"
input_device_display_name = "R36S"
input_vendor_id = "1"
input_product_id = "4488"
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "2"
input_exit_emulator_btn = "9"
input_load_state_btn = "4"
input_save_state_btn = "5"
input_toggle_fast_forward_btn = "7"
