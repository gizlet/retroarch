name: PR triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: read
    uses: gizlet/.github/.github/workflows/pr-triage.yml@latest
    with:
      commands: |
        /ci
        /codex-review
      client-id: ${{ vars.GIZLET_BOT_CLIENT_ID }}
    secrets:
      GIZLET_BOT_PRIVATE_KEY: ${{ secrets.GIZLET_BOT_PRIVATE_KEY }}
